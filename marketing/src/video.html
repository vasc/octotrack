<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Octotrack film</title>
<style>
:root{
  --bg:#141413; --ink:#eeecea; --ink2:#a8a29e; --ink3:#78716c; --amber:#fbbf24; --amberD:#b45309;
  --pbg:#fafaf9; --psurf:#ffffff; --pline:#e7e5e4; --pink:#1c1917; --pink2:#57534e; --psoft:#fef3c7; --pamberline:#f59e0b;
  --good:#15803d; --goodD:#4ade80; --bad:#b91c1c; --badD:#f87171; --info:#1d4ed8;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1200px 700px at 70% 20%, #24211d 0%, #141413 60%)}
.scene{position:absolute;inset:0;opacity:0}
.a{position:absolute;will-change:transform,opacity}
.kicker{font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);font-weight:600}
.h1{font-size:96px;line-height:1.02;font-weight:700;letter-spacing:-.03em}
.h2{font-size:64px;line-height:1.08;font-weight:700;letter-spacing:-.02em}
.h3{font-size:40px;line-height:1.2;font-weight:600;letter-spacing:-.01em}
.body{font-size:30px;line-height:1.4;color:var(--ink2)}
.mono{font-family:var(--mono)}
.caption{left:120px;top:96px;width:620px}
.caption .h3{color:var(--ink)}
.caption .body{margin-top:18px}
/* product mock, light theme */
.app{background:var(--pbg);color:var(--pink);border-radius:18px;box-shadow:0 40px 120px rgb(0 0 0 / .55);overflow:hidden;font-size:22px}
.app .bar{display:flex;align-items:center;gap:26px;padding:20px 30px;background:#fff;border-bottom:1px solid var(--pline)}
.app .logo{font-weight:700;font-size:24px}
.app .counts{display:flex;gap:18px;font-weight:600;font-size:19px}
.sec{padding:16px 30px 6px}
.sec h4{margin:0 0 10px;font-size:25px;font-weight:700}
.row{background:#fff;border:1px solid var(--pline);border-radius:14px;padding:14px 18px;margin-bottom:10px;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:baseline}
.row .n{color:var(--pink2);font-weight:700}
.row .t{font-weight:600}
.row .m{color:var(--pink2);font-size:18px}
.row .hl{color:#3f3f46;font-size:19px;grid-column:2/4}
.chip{display:inline-block;font-size:16px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:7px}
.chip.am{background:var(--psoft);color:var(--amberD)}
.chip.rd{background:#fee2e2;color:var(--bad)}
.chip.gr{background:#dcfce7;color:var(--good)}
.chip.bl{background:#dbeafe;color:var(--info)}
.fold{border:1px dashed #a1a1aa;background:#fafafa;border-radius:14px;padding:14px 18px;color:#3f3f46;display:flex;justify-content:space-between}
.callout{display:flex;gap:16px;align-items:flex-start;width:520px}
.callout i{flex:none;width:14px;height:14px;border-radius:50%;margin-top:12px;background:var(--amber)}
.callout b{display:block;font-size:30px;color:var(--ink)}
.callout span{font-size:24px;color:var(--ink2);line-height:1.35}
/* question card */
.q{background:#fff;color:var(--pink);border:3px solid var(--pink);border-radius:20px;padding:30px 34px;width:1060px;box-shadow:0 40px 120px rgb(0 0 0 / .55)}
.q .meta{display:flex;gap:16px;font-size:18px;color:var(--pink2);font-weight:600;letter-spacing:.04em}
.q h5{margin:14px 0 10px;font-size:38px;font-weight:700;letter-spacing:-.01em}
.q p{margin:0;font-size:23px;line-height:1.45;color:#3f3f46}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.opt{border:2px solid #d4d4d8;border-radius:14px;padding:16px 18px;font-size:21px;line-height:1.35;color:#3f3f46}
.opt b{display:block;color:var(--pink);font-size:24px;margin-bottom:4px}
.opt.rec{border-color:var(--amberD);background:var(--psoft)}
.why{margin-top:18px;font-size:21px;color:#3f3f46}
.undo{display:flex;justify-content:space-between;align-items:center;background:#18181b;color:#fafafa;border-radius:14px;padding:18px 24px;font-size:23px;width:1060px}
.undo .bar2{position:absolute;left:0;bottom:0;height:5px;background:var(--amber)}
.key{width:110px;height:110px;border-radius:22px;background:#2a2725;border:2px solid #4a4541;box-shadow:0 8px 0 #0b0a09;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:700;color:var(--ink)}
/* agents diagram */
.node{border-radius:18px;padding:22px 26px;font-size:26px;font-weight:600;background:#211f1c;border:2px solid #3f3c39;color:var(--ink)}
.node small{display:block;font-size:20px;font-weight:500;color:var(--ink2);margin-top:6px}
.node.line{background:var(--pbg);color:var(--pink);border-color:#d6d3d1}
.step{display:flex;gap:18px;align-items:center;font-size:26px;width:820px}
.step .num{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid #57534e;display:flex;align-items:center;justify-content:center;font-weight:700}
.step .res{margin-left:auto;font-weight:700}
/* terminal */
.term{background:#0d0c0b;border:1px solid #2e2c2a;border-radius:16px;width:1060px;box-shadow:0 40px 120px rgb(0 0 0 / .6);overflow:hidden}
.term .tb{display:flex;gap:9px;padding:14px 18px;background:#1c1b1a}
.term pre{margin:0;padding:26px 30px;font-family:var(--mono);font-size:25px;line-height:1.6;color:#e7e5e4;white-space:pre-wrap;min-height:520px}
.term .p{color:var(--amber)}
.term .o{color:#a8a29e}
.term .g{color:var(--goodD)}
.pill{display:inline-flex;gap:12px;align-items:center;font-size:27px;padding:16px 22px;border-radius:14px;background:#211f1c;border:1px solid #3f3c39;color:var(--ink)}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--amber)}
.notif{width:560px;background:rgb(255 255 255 / .94);color:var(--pink);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgb(0 0 0 / .45);font-size:20px}
.notif small{display:block;color:var(--pink2);font-size:15px;letter-spacing:.06em;font-weight:600;margin-bottom:4px}
.logwall{font-family:var(--mono);font-size:19px;line-height:1.5;color:#57534e;white-space:pre}
.app .nav span{padding:8px 16px;border-radius:9px;color:var(--pink2);font-size:20px}
.app .nav span.on{background:var(--pink);color:#fafaf9}
.app .counts b{font-weight:600}
.sec h4 small{color:var(--pink2);font-weight:500;margin-left:6px}
.term .tb i{width:14px;height:14px;border-radius:50%;background:#3f3c39}
.node.line small{color:var(--pink2)}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const _W = 1920, _H = 1080
const clamp = (x) => (x < 0 ? 0 : Math.min(x , 1))
const ease = (x) => 1 - (1 - clamp(x)) ** 3
const easeIO = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2 }
const P = (t, a, b) => ease((t - a) / (b - a))
const _PIO = (t, a, b) => easeIO((t - a) / (b - a))
const stage = document.getElementById('stage')

function el(parent, html) {
  const d = document.createElement('div')
  d.innerHTML = html.trim()
  const n = d.firstElementChild
  parent.appendChild(n)
  return n
}
function put(n, x, y) { n.style.left = `${x}px`; n.style.top = `${y}px`; return n }
function show(n, o, dx = 0, dy = 0, s = 1) {
  n.style.opacity = o
  n.style.transform = `translate(${dx}px, ${dy}px) scale(${s})`
}
// appear: fades and rises in over 0.6s from time a
function rise(n, t, a, d = 0.6, dist = 30) { const p = P(t, a, a + d); show(n, p, 0, (1 - p) * dist) }

const LINES = [
  ['1', 'One plan, one meal', 'owner meals, asleep · waiting on you · step 2 of 4', 'Mockup ready after six rejected restyles. Nothing built until you answer.'],
  ['2', 'Sendspin enclosure', 'owner panel-widgets · waiting on you · step 3 of 4', 'Printed; the short board fits. One answer and one measurement from the final print.'],
  ['3', 'Quiet household trial', 'owner ttube, asleep · waiting on you · step 2 of 3', 'Only plays fetch from home. No block in nine days.'],
  ['4', 'Answer delivery', 'owner octotrack-builder · agents on it · step 2 of 3', 'Inbox, pickup and reports are live. One real wake left to try.'],
  ['5', 'South Tyrol trip', 'no owner · step 3 of 4', 'Down to the final hotel pick.'],
]
const NEXT = ['Wall mount', 'Multi-commit PR groups', 'Firmware without casts', 'Plan more than one seat ahead']

function appMock(parent, opts = {}) {
  const app = el(parent, `<div class="a app" style="width:${opts.w || 1080}px"></div>`)
  app.innerHTML = `
    <div class="bar"><span class="logo">Octotrack</span><span class="nav"><span class="on">Lines</span><span>Log</span><span>Agents</span></span>
      <span class="counts"><b style="color:var(--amberD)">4 to answer</b><b style="color:var(--amberD)">3 to do</b><b style="color:var(--info)">1 to accept</b><b style="color:var(--bad)">1 to step in</b></span></div>
    <div class="sec" data-k="wk"><h4>Working on <small>5</small></h4>${LINES.map((l, i) => `
      <div class="row" data-k="r${i}"><span class="n">${l[0]}</span><span><span class="t">${l[1]}</span> <span class="m">· ${l[2]}</span></span><span>${i < 3 ? '<span class="chip am">FOR YOU</span>' : i === 4 ? '<span class="chip rd">STEP IN</span>' : ''}</span><span class="hl">${l[3]}</span></div>`).join('')}</div>
    <div class="sec" data-k="nx"><h4>Up next <small>4 · scoped, never built until you start them</small></h4>
      <div class="row" style="grid-template-columns:30px 1fr"><span class="n">6</span><span class="m" style="font-size:20px">${NEXT.join(' · ')}</span></div></div>
    <div class="sec" data-k="pr"><h4>Proposed <small>1</small></h4>
      <div class="row" style="border-color:#bfdbfe;grid-template-columns:1fr auto"><span><span class="t">Widgets redesign</span> <span class="m">· recommended: up next, after Wall mount</span></span><span class="chip bl">TO ACCEPT</span></div></div>
    <div class="sec" data-k="tb" style="padding-bottom:24px"><div class="fold"><span><b>Tabled · 5</b> · Podcast cleanup, Garden sensors, Mesh Wi-Fi… · questions held</span><span>Show</span></div></div>`
  return app
}

const scenes = []
function scene(name, dur, build) { scenes.push({ name, dur, build }) }

// 1 · hook
scene('hook', 7, (root) => {
  const l1 = put(el(root, `<div class="a h1">Twelve AI agents.</div>`), 120, 250)
  const l2 = put(el(root, `<div class="a h1" style="color:var(--ink2)">Forty open questions.</div>`), 120, 370)
  const l3 = put(el(root, `<div class="a h1" style="color:var(--amber)">One of you.</div>`), 120, 490)
  const msgs = [
    ['PANEL-WIDGETS', 'Which board goes in, 26 mm or 30 mm?'], ['MEALS', 'Build the restructure as mocked up?'], ['MEDIARR', 'Should I keep cleaning podcasts?'],
    ['TTUBE', 'How should slow downloads treat skipping?'], ['ROADTRIP', 'Which hotel, the lake or the town?'], ['OCTOTRACK-BUILDER', 'Can you log claude back in?'],
    ['STACK', 'Group multi-commit PRs?'], ['PANEL-WIDGETS', 'How big should the USB-C opening be?'], ['MEALS', 'Today and Week, or one plan?'],
  ]
  const ns = msgs.map((m, i) => put(el(root, `<div class="a notif"><small>${m[0]}</small>${m[1]}</div>`), 1240 + (i % 2) * 40, 120 + i * 92))
  return (t) => {
    rise(l1, t, 0.2); rise(l2, t, 1.0); rise(l3, t, 1.8)
    ns.forEach((n, i) => { const a = 0.6 + i * 0.42; const p = P(t, a, a + 0.45); show(n, p, (1 - p) * 120, 0, 1) })
  }
})

// 2 · problem
scene('problem', 10, (root) => {
  const lines = []
  for (let i = 0; i < 80; i++) lines.push(`[${String(8 + (i % 10)).padStart(2, '0')}:${String((i * 7) % 60).padStart(2, '0')}] ${['agent', 'drift', 'pr', 'decision', 'watch'][i % 5]}.${['updated', 'opened', 'claimed', 'resolved', 'checked'][(i * 3) % 5]} ${['PANEL', 'OCT', 'MEALS', 'TTUBE', 'D'][i % 5]}-${(i * 13) % 97} ${'· '.repeat(1 + (i % 4))}${['status changed', 'context: see thread', 'waiting on Vasco', 'fingerprint stale', 'checks running'][i % 5]}`)
  const wall = put(el(root, `<div class="a logwall">${lines.join('\n')}</div>`), 980, 0)
  const k = put(el(root, `<div class="a kicker">The problem</div>`), 120, 200)
  const s1 = put(el(root, `<div class="a h2" style="width:800px">Context for one decision, buried in a million lines.</div>`), 120, 260)
  const s2 = put(el(root, `<div class="a h3" style="width:780px;color:var(--ink2)">Questions about work you tabled weeks ago.</div>`), 120, 560)
  const s3 = put(el(root, `<div class="a h3" style="width:780px;color:var(--ink2)">Projects as flat tables of fields. Roadmaps nobody reads.</div>`), 120, 680)
  return (t) => {
    show(wall, 0.9, 0, -t * 70)
    rise(k, t, 0.2); rise(s1, t, 0.5); rise(s2, t, 3.0); rise(s3, t, 5.0)
  }
})

// 3 · title
scene('title', 5, (root) => {
  const w = put(el(root, `<div class="a" style="width:1920px;text-align:center;font-size:150px;font-weight:800;letter-spacing:-.04em">Octotrack</div>`), 0, 330)
  const s = put(el(root, `<div class="a h3" style="width:1920px;text-align:center;color:var(--amber)">Lines of work at the centre.</div>`), 0, 540)
  const b = put(el(root, `<div class="a body" style="width:1920px;text-align:center">A tracker for one developer and many AI agents.</div>`), 0, 620)
  return (t) => { const p = P(t, 0.1, 1.0); show(w, p, 0, 0, 0.94 + 0.06 * p); rise(s, t, 0.8); rise(b, t, 1.4) }
})

// 4 · one list
scene('list', 13, (root) => {
  const cap = put(el(root, `<div class="a caption"><div class="kicker">How it works · 1</div><div class="h3" style="margin-top:16px">One list, in your order.</div><div class="body">Your order is everyone's order: what reaches you first, which line an agent takes, the order of the log.</div></div>`), 120, 110)
  const app = put(appMock(root, { w: 1080 }), 780, 70)
  const parts = ['wk', 'nx', 'pr', 'tb'].map((k) => app.querySelector(`[data-k="${k}"]`))
  const rows = [0, 1, 2, 3, 4].map((i) => app.querySelector(`[data-k="r${i}"]`))
  const c1 = put(el(root, `<div class="a callout"><i></i><div><b>Working on</b><span>Lines agents are on now, each with one owner and a headline.</span></div></div>`), 120, 520)
  const c2 = put(el(root, `<div class="a callout"><i style="background:var(--ink2)"></i><div><b>Up next</b><span>Planned and scoped. Never built until you start it.</span></div></div>`), 120, 680)
  const c3 = put(el(root, `<div class="a callout"><i style="background:#57534e"></i><div><b>Tabled</b><span>One folded row. Its questions wait, silent.</span></div></div>`), 120, 840)
  return (t) => {
    rise(cap, t, 0.2)
    const p = P(t, 0.3, 1.2); app.style.transformOrigin = 'top left'; show(app, p, (1 - p) * 80, 0, 0.92)
    parts.forEach((n, i) => { const q = P(t, 1.0 + i * 0.5, 1.6 + i * 0.5); n.style.opacity = q })
    rows.forEach((n, i) => { const q = P(t, 1.2 + i * 0.25, 1.8 + i * 0.25); n.style.opacity = q; n.style.transform = `translateX(${(1 - q) * 30}px)` })
    rise(c1, t, 4.0); rise(c2, t, 6.0); rise(c3, t, 8.0)
    const hl = (n, a, b) => { const on = t > a && t < b; n.style.boxShadow = on ? '0 0 0 4px #fbbf24' : 'none' }
    hl(parts[0], 4.0, 6.0); hl(parts[1], 6.0, 8.0); hl(parts[3], 8.0, 10.5)
  }
})

// 5 · a question that stands alone
scene('question', 12, (root) => {
  const cap = put(el(root, `<div class="a caption"><div class="kicker">How it works · 2</div><div class="h3" style="margin-top:16px">Questions that stand alone.</div><div class="body">Agents must write the situation, what each option does, and why they recommend one. You read one card, not a thread.</div></div>`), 120, 110)
  const q = put(el(root, `<div class="a q">
    <div class="meta"><span style="color:var(--pink)">FOCUSED</span><span style="color:var(--amberD)">QUESTION · D-34</span><span>Sendspin enclosure · holds up the final print</span></div>
    <h5>Which board goes in?</h5>
    <p>The supplier ships two. The printed base was test-fitted with the 26 mm one; your prototype runs the 30 mm one. The mount holds exactly one.</p>
    <div class="opts"><div class="opt rec"><b>1 · 26 mm <span style="font-size:16px;color:var(--amberD)">RECOMMENDED</span></b>Print as it is; the prototype gets the short board.</div><div class="opt"><b>2 · 30 mm</b>Rebuild the model and test-fit again first.</div></div>
    <div class="why"><b style="color:var(--pink)">Why 1:</b> it is the one already proven in the printed base.</div></div>`), 780, 150)
  const key = put(el(root, `<div class="a key">1</div>`), 1255, 760)
  const undo = put(el(root, `<div class="a undo" style="position:absolute"><span>Sending "26 mm" to Sendspin enclosure · <b>u</b> to undo</span><span style="color:var(--amber)">Undo</span><div class="bar2"></div></div>`), 780, 900)
  const bar = undo.querySelector('.bar2')
  const done = put(el(root, `<div class="a undo" style="background:#10291a;color:#dcfce7"><span>✓ D-34 carried out: model set to the short board</span><span>by panel-widgets</span></div>`), 780, 900)
  const opt1 = q.querySelector('.opt.rec')
  return (t) => {
    rise(cap, t, 0.2)
    const p = P(t, 0.3, 1.1); show(q, p, 0, (1 - p) * 40)
    const kp = P(t, 5.0, 5.4); const press = t > 5.6 && t < 5.9 ? 8 : 0
    show(key, kp * (1 - P(t, 7.5, 8.0)), 0, press, 1)
    opt1.style.boxShadow = t > 5.6 ? '0 0 0 4px #b45309' : 'none'
    const u = P(t, 5.8, 6.2) * (1 - P(t, 9.4, 9.7)); show(undo, u, 0, (1 - P(t, 5.8, 6.2)) * 20)
    bar.style.width = `${clamp((t - 5.8) / 3.6) * 100}%`
    show(done, P(t, 9.6, 10.1), 0, 0)
  }
})

// 6 · agents own lines
scene('agents', 13, (root) => {
  const cap = put(el(root, `<div class="a caption"><div class="kicker">How it works · 3</div><div class="h3" style="margin-top:16px">Agents own lines. Nothing stalls.</div><div class="body">Each working line has one owner agent. If it stops, Octotrack finds another, or starts a session in its own git worktree, up to the cap you set.</div></div>`), 120, 110)
  const line = put(el(root, `<div class="a node line" style="width:420px">L-12 · Answer delivery<small>working on · step 2 of 3 · OCT-41 open</small></div>`), 860, 150)
  const own = put(el(root, `<div class="a node" style="width:420px">octotrack-builder<small>owner · last command 14:10</small></div>`), 1360, 150)
  const x = put(el(root, `<div class="a" style="font-size:90px;font-weight:800;color:var(--badD)">✕</div>`), 1530, 150)
  const steps = [
    ['1', 'Last owner woken', 'wake failed', 'var(--badD)'],
    ['2', 'Idle agents with the repo told', 'none listening', 'var(--ink3)'],
    ['3', 'Start command runs octotrack.3', 'took the line', 'var(--goodD)'],
  ].map((s, i) => put(el(root, `<div class="a step"><span class="num">${s[0]}</span><span>${s[1]}</span><span class="res" style="color:${s[3]}">${s[2]}</span></div>`), 860, 420 + i * 100))
  const wt = put(el(root, `<div class="a node" style="width:820px;border-color:#4ade80"><span class="mono" style="font-size:22px">~/projs/octotrack-worktrees/octotrack.3</span><small>its own worktree · reads the line's inbox · picks up OCT-41</small></div>`), 860, 760)
  return (t) => {
    rise(cap, t, 0.2); rise(line, t, 0.5); rise(own, t, 1.0)
    const xo = P(t, 2.6, 2.9); show(x, xo, 0, 0, 1.4 - 0.4 * xo); own.style.opacity = 1 - 0.6 * P(t, 2.6, 3.0)
    steps.forEach((n, i) => {
      rise(n, t, 3.4 + i * 1.6)
    })
    rise(wt, t, 8.6)
  }
})

// 7 · tabled means quiet
scene('quiet', 9, (root) => {
  const cap = put(el(root, `<div class="a caption"><div class="kicker">How it works · 4</div><div class="h3" style="margin-top:16px">Tabled means quiet.</div><div class="body">Table a line and its owner winds down in 15 minutes. Its questions are held, the log leaves it out, and your phone never buzzes for it.</div></div>`), 120, 110)
  const row = put(el(root, `<div class="a row" style="width:980px;color:var(--pink);font-size:24px;grid-template-columns:1fr auto"><span><span class="t">Podcast cleanup</span> <span class="m">· owner mediarr · 2 questions for you</span></span><span class="chip am">FOR YOU</span></div>`), 860, 260)
  const btn = put(el(root, `<div class="a pill" style="background:#fafaf9;color:var(--pink);border-color:#d6d3d1">Table… <span style="color:var(--pink2);font-size:22px">"The disk is not tight"</span></div>`), 860, 380)
  const fold = put(el(root, `<div class="a fold" style="width:980px;font-size:24px"><span><b>Tabled · 6</b> · Podcast cleanup, Garden sensors… · questions held</span><span>Show</span></div>`), 860, 560)
  const pills = ['2 questions held', 'left out of the log', 'no buzz'].map((s, i) => put(el(root, `<div class="a pill"><i style="background:var(--ink3)"></i>${s}</div>`), 860 + i * 330, 700))
  return (t) => {
    rise(cap, t, 0.2)
    const r = P(t, 0.4, 1.0) * (1 - P(t, 3.0, 3.6)); show(row, r, 0, P(t, 3.0, 3.6) * 300, 1 - 0.1 * P(t, 3.0, 3.6))
    show(btn, P(t, 1.4, 1.8) * (1 - P(t, 3.0, 3.3)), 0, 0)
    rise(fold, t, 3.4)
    pills.forEach((n, i) => {
      rise(n, t, 4.4 + i * 0.6)
    })
  }
})

// 8 · built for agents and terminals
scene('tech', 11, (root) => {
  const cap = put(el(root, `<div class="a caption"><div class="kicker">Under the hood</div><div class="h3" style="margin-top:16px">Every action is a command.</div><div class="body">Agents work through the CLI. You use the dashboard, your phone, or the same CLI.</div></div>`), 120, 110)
  const term = put(el(root, `<div class="a term"><div class="tb"><i></i><i></i><i></i></div><pre></pre></div>`), 780, 110)
  const pre = term.querySelector('pre')
  const script = [
    ['p', '$ octo line take'], ['o', '→ L-12 Answer delivery · owner · OCT-41'],
    ['p', '$ octo question ask --situation … --option … --recommend 1'], ['o', '→ D-56 asked · waits on L-3 · you will be woken'],
    ['p', '$ octo question record D-34 --said "go with 26 mm"'], ['o', '→ recorded out of band · relayed by panel-widgets'],
    ['p', '$ octo line start L-9 --me'], ['g', '→ South Tyrol trip · working on · owner search started'],
  ]
  const pills = ['SQLite, on your Mac', 'Reach it anywhere over Tailscale', 'Answers wake the session that needs them', 'Web Push only when it matters']
    .map((s, i) => put(el(root, `<div class="a pill"><i></i>${s}</div>`), 120 + (i % 2) * 0, 560 + i * 96))
  return (t) => {
    rise(cap, t, 0.2); rise(term, t, 0.3)
    let out = ''
    let clock = 0.9
    for (const [cls, text] of script) {
      if (cls === 'p') {
        const n = Math.floor(clamp((t - clock) / 1.0) * text.length)
        if (t > clock) out += `<span class="p">${text.slice(0, 2)}</span>${text.slice(2, Math.max(2, n))}\n`
        clock += 1.1
      } else {
        if (t > clock) out += `<span class="${cls}">${text}</span>\n\n`
        clock += 0.4
      }
    }
    pre.innerHTML = out
    pills.forEach((n, i) => {
      rise(n, t, 6.4 + i * 0.6)
    })
  }
})

// 9 · end
scene('end', 6, (root) => {
  const w = put(el(root, `<div class="a" style="width:1920px;text-align:center;font-size:130px;font-weight:800;letter-spacing:-.04em">Octotrack</div>`), 0, 300)
  const s = put(el(root, `<div class="a h3" style="width:1920px;text-align:center">Order the work. Answer what blocks it.<br><span style="color:var(--amber)">Agents do the rest.</span></div>`), 0, 500)
  const u = put(el(root, `<div class="a body mono" style="width:1920px;text-align:center">github.com/vasc/octotrack</div>`), 0, 720)
  const c = put(el(root, `<div class="a" style="width:1920px;text-align:center;font-size:20px;color:var(--ink3);letter-spacing:.14em">DESIGN CONCEPT</div>`), 0, 790)
  return (t) => { const p = P(t, 0.1, 0.9); show(w, p, 0, 0, 0.95 + 0.05 * p); rise(s, t, 0.7); rise(u, t, 1.4); rise(c, t, 1.8) }
})

// cuts: [scene name, speed]
const CUTS = {
  explainer: [['hook', 1], ['problem', 1], ['title', 1], ['list', 1], ['question', 1], ['agents', 1], ['quiet', 1], ['tech', 1], ['end', 1]],
  teaser: [['hook', 1.6], ['title', 1.4], ['list', 1.7], ['question', 1.7], ['end', 1.2]],
}
const cut = (new URLSearchParams(location.search).get('cut')) || 'explainer'
const FADE = 0.45
const timeline = []
let acc = 0
for (const [name, speed] of CUTS[cut]) {
  const s = scenes.find((x) => x.name === name)
  const root = el(stage, `<div class="scene"></div>`)
  const update = s.build(root)
  const dur = s.dur / speed
  timeline.push({ root, update, start: acc, dur, speed })
  acc += dur
}
window.DURATION = acc
window.render = (T) => {
  for (const sc of timeline) {
    const lt = T - sc.start
    if (lt < -FADE || lt > sc.dur + FADE) { sc.root.style.opacity = 0; continue }
    const first = sc === timeline[0], last = sc === timeline[timeline.length - 1]
    const fin = first ? 1 : clamp((lt + FADE) / (2 * FADE))
    const fout = last ? 1 : clamp((sc.dur + FADE - lt) / (2 * FADE))
    sc.root.style.opacity = Math.min(fin, fout)
    sc.update(Math.max(0, lt) * sc.speed)
  }
}
window.render(0)
window.READY = true
</script>
