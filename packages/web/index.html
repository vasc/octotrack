<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Octotrack</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#121212" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23141413'/%3E%3Cg transform='translate(4.8 4.8) scale(0.8)' fill='none' stroke='%23f3efe6' stroke-width='3.6' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpolyline points='43.5,15.92 43.5,32.08 32.08,43.5 15.92,43.5 4.5,32.08 4.5,15.92 15.92,4.5 32.08,4.5'/%3E%3Cpolyline points='12,28.97 12,19.03 19.03,12 28.97,12 36,19.03 36,28.97 28.97,36 19.03,36'/%3E%3Cpolygon points='29.1,26.11 26.11,29.1 21.89,29.1 18.9,26.11 18.9,21.89 21.89,18.9 26.11,18.9 29.1,21.89' fill='%23e8890c' stroke='none'/%3E%3C/g%3E%3C/svg%3E" />
    <!-- Starts the data fetch before any script has been parsed, so that first paint has real data. -->
    <link rel="preload" href="/api/bootstrap" as="fetch" crossorigin="anonymous" />
    <!-- The theme and mode this device keeps, applied before the first paint so the page never flashes another. -->
    <script>
      try {
        const look = JSON.parse(localStorage.getItem("octotrack.appearance") ?? "null");
        const root = document.documentElement;
        if (look?.palette && look.palette !== "paper") root.setAttribute("data-palette", look.palette);
        if (look?.mode && look.mode !== "system") root.setAttribute("data-mode", look.mode);
      } catch {
        // Nothing kept, or storage refused: the theme stays Paper, as the system.
      }
    </script>
    <!-- Paper's ground until the stylesheet loads; the stylesheet's :root then sets the theme's, over the whole page. -->
    <style>
      html { background: #f6f6f4; }
      @media (prefers-color-scheme: dark) { html { background: #121212; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
