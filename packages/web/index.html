<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Octotrack</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#141413" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23d97706'/%3E%3C/svg%3E" />
    <!-- Starts the data fetch before any script has been parsed, so that first paint has real data. -->
    <link rel="preload" href="/api/bootstrap" as="fetch" crossorigin="anonymous" />
    <!-- The theme and mode this device keeps, applied before the first paint so the page never flashes another. -->
    <script>
      try {
        const look = JSON.parse(localStorage.getItem("octotrack.appearance") ?? "null");
        const root = document.documentElement;
        if (look?.palette && look.palette !== "paper") root.setAttribute("data-palette", look.palette);
        if (look?.mode && look.mode !== "system") root.setAttribute("data-mode", look.mode);
      } catch {
        // Nothing kept, or storage refused: the theme stays Paper, as the system.
      }
    </script>
    <style>
      html { background: #fafaf9; }
      @media (prefers-color-scheme: dark) { html { background: #141413; } }
      html[data-mode="light"] { background: #fafaf9; }
      html[data-mode="dark"] { background: #141413; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
