<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Triage, tabling a line</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F45C6;text-decoration:none}a:hover{color:#1F2F94}
</style>
</helmet>
<div style="position: relative; min-height: 1000px; background: #F2F3F5; color: #14161B; font-family: 'Inter Tight', Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; overflow: hidden">

<div aria-hidden="true">
<header style="display: flex; align-items: center; gap: 32px; height: 56px; padding: 0 32px; border-bottom: 1px solid #E3E6EB">
<span style="display: flex; align-items: center; gap: 10px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8.2 2.8h7.6l5.4 5.4v7.6l-5.4 5.4H8.2l-5.4-5.4V8.2z"></path><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"></circle></svg>Octotrack</span>
</header>
<div style="max-width: 1200px; margin: 0 auto; padding: 56px 32px; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 34px; font-weight: 600">Team offsite</span>
<span style="height: 320px; border-radius: 16px; background: #FFFFFF"></span>
</div>
</div>

<div style="position: absolute; inset: 0; background: rgba(20, 22, 27, 0.32)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="tb-title" style="position: absolute; left: 50%; top: 120px; transform: translateX(-50%); width: 520px; max-width: calc(100% - 32px); box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; padding: 32px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 24px 64px -16px rgba(20, 22, 27, 0.4)">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="tb-title" style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Table Team offsite</h2>
<span style="color: #6E7480">Set it aside, out of Working on, until you look again.</span>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Why
<textarea rows="3" style="padding: 12px 14px; border: 1.5px solid #2F45C6; border-radius: 10px; font: inherit; font-size: 16px; font-weight: 400; line-height: 1.45; color: #14161B; resize: vertical; outline: none">We go in spring instead; prices drop after the holidays.</textarea>
</label>

<fieldset style="display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; border: 0">
<legend style="padding: 0 0 8px; font-size: 14px; font-weight: 600">Look again</legend>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<button type="button" aria-pressed="false" style="height: 34px; padding: 0 14px; border: 1px solid #D9DDE4; border-radius: 17px; background: #FFFFFF; font: inherit; font-size: 14px">In a week</button>
<button type="button" aria-pressed="false" style="height: 34px; padding: 0 14px; border: 1px solid #D9DDE4; border-radius: 17px; background: #FFFFFF; font: inherit; font-size: 14px">In a month</button>
<button type="button" aria-pressed="true" style="height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: #14161B; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500">1 February</button>
<button type="button" aria-pressed="false" style="height: 34px; padding: 0 14px; border: 1px dashed #C9CFE0; border-radius: 17px; background: none; font: inherit; font-size: 14px; color: #474D59">No date</button>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; background: #F6F7F9; font-size: 14px; color: #474D59">
<span style="font-weight: 600; color: #14161B">What happens</span>
<span>No agent is on it, so nothing winds down. Its plan and history stay; on 1 February it comes back to you to start or table again.</span>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<button type="submit" style="height: 40px; padding: 0 18px; border: 0; border-radius: 9px; background: #14161B; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600">Table it</button>
<button type="button" style="height: 40px; padding: 0 16px; border: 1px solid #E3E6EB; border-radius: 9px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500">Cancel</button>
<span style="margin-left: auto; font-size: 13px; color: #6E7480">You can undo it for a few seconds</span>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
