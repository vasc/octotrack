<!doctype html>
<html lang="en">

<title>Octagon bullseye</title>

<body>
<x-dc>
<helmet>

<div style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 24px; border-bottom: 1px solid #d9d5cc">
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">Octagon bullseye</h1>
<p style="margin: 0; font-size: 15px; color: #5c5a54">Close to today's mark: an octagon, now a target, with one centre that is yours. Each one as the app icon in dark and light, at 60, 32 and 16 px, flat at 32 and 16, and in the bar.</p>
</div>
<sc-for list="{{marks}}" as="item" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 22px; height: 150px; border-bottom: 1px solid #e6e2d9">
<div style="width: 210px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 15px; font-weight: 600">{{item.name}}</div>
<div style="font-size: 13px; line-height: 1.4; color: #5c5a54">{{item.idea}}</div>
</div>
<div class="dark" style="width: 120px; height: 120px; border-radius: 27px; display: flex; align-items: center; justify-content: center"><svg width="80" height="80" role="img" aria-label="{{item.name}}, dark"><use href="#{{item.id}}"></use></svg></div>
<div class="light" style="width: 120px; height: 120px; border-radius: 27px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px #e3ddd0"><svg width="80" height="80" role="img" aria-label="{{item.name}}, light"><use href="#{{item.id}}"></use></svg></div>
<div style="display: flex; align-items: flex-end; gap: 12px">
<div class="dark" style="width: 60px; height: 60px; border-radius: 13px; display: flex; align-items: center; justify-content: center"><svg width="40" height="40" aria-hidden="true"><use href="#{{item.id}}"></use></svg></div>
<div class="dark" style="width: 32px; height: 32px; border-radius: 7px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" aria-hidden="true"><use href="#{{item.id}}"></use></svg></div>
<div class="dark" style="width: 16px; height: 16px; border-radius: 4px; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" aria-hidden="true"><use href="#{{item.id}}"></use></svg></div>
<div class="mono" style="display: flex; align-items: flex-end; gap: 12px; padding-left: 8px">
<svg width="32" height="32" aria-hidden="true"><use href="#{{item.id}}"></use></svg>
<svg width="16" height="16" aria-hidden="true"><use href="#{{item.id}}"></use></svg>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-left: auto">
<div class="barlight" style="display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 6px; font-size: 13px; font-weight: 600"><svg width="16" height="16" aria-hidden="true"><use href="#{{item.id}}"></use></svg>Octotrack<span style="font-weight: 400; opacity: 0.7; margin-left: 14px">Lines</span><span style="font-weight: 400; opacity: 0.7; margin-left: 10px">For you</span></div>
<div class="bardark" style="display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 6px; font-size: 13px; font-weight: 600"><svg width="16" height="16" aria-hidden="true"><use href="#{{item.id}}"></use></svg>Octotrack<span style="font-weight: 400; opacity: 0.7; margin-left: 14px">Lines</span><span style="font-weight: 400; opacity: 0.7; margin-left: 10px">For you</span></div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":1380}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      marks: [
        { id: 'm-today', name: 'Today', idea: 'For comparison: the octagon outline the bar draws now. The app icon is an amber dot.' },
        { id: 'm-a1', name: 'A1 · Rings', idea: 'The plain target: two octagon rings round a solid centre.' },
        { id: 'm-a2', name: 'A2 · Heavy', idea: 'One thick ring and the centre. Two shapes, so it holds at 16 px.' },
        { id: 'm-a3', name: 'A3 · Seal', idea: 'A solid octagon with two fine rings let into it, like a stamp.' },
        { id: 'm-a4', name: 'A4 · Eight sides', idea: 'The ring broken at its corners into eight lines of work, one of them yours.' },
        { id: 'm-a5', name: 'A5 · Lanes', idea: 'Each ring leaves a side open, like the lanes of a running track.' },
        { id: 'm-a6', name: 'A6 · Turned', idea: 'The middle ring turned an eighth, so the corners interleave.' },
        { id: 'm-a7', name: 'A7 · Spiral', idea: 'One octagonal track winding in to the centre: a target drawn as a single line.' }
      ]
    };
  }
}
</script>
</body>
</html>
